# Runs the tests (tests/) on every push to main and on pull requests.
name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: sh tests/run.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas
          path: tests/out
