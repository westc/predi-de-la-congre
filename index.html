<script>
// Which congregation's Sheet this app talks to: ?api=ID from the QR code (the Apps Script deployment id).
// A conductor's personal link also has &c=KEY. Both are remembered, and kept in the address so
// "Instalar" / "Agregar a inicio" opens the app already connected.
(function () {
  var q = new URLSearchParams(location.search);
  var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var set = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var ok = function (v, min) { return new RegExp('^[\\w-]{' + min + ',200}$').test(v || ''); };
  var id = q.get('api');
  if (ok(id, 20)) set('predi-api', id); else id = ok(get('predi-api'), 20) ? get('predi-api') : '';
  window.API_ID = id;
  window.START_SALIDA = q.get('salida') || '';
  window.DEMO = q.has('demo') || (!id && /^(localhost|127\.0\.0\.1)$/.test(location.hostname));
  var key = window.DEMO ? 'demo' : id, c = q.get('c');
  if (ok(c, 16)) set('predi-c-' + key, c); else c = get('predi-c-' + key) || '';
  window.CONDUCTOR_KEY = c;
  if (id && !q.has('demo')) history.replaceState(null, '', location.pathname + '?api=' + id + (c ? '&c=' + c : ''));
})();
</script>
<script>
// Installing: Chrome, Edge and Android need the manifest; the installed app opens at ./ and finds the saved link above
// (it shares this browser's storage). iPhone/iPad don't share storage with the installed app, so there the manifest is
// left out and "Agregar a inicio" keeps the current address, with ?api= and a conductor's &c=.
(function () {
  var ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return;
  var link = document.createElement('link');
  link.rel = 'manifest';
  link.href = 'manifest.webmanifest';
  document.head.appendChild(link);
})();
</script>

  <label>O pega aquí el enlace que te pasaron</label><input type="text" id="setup-link" placeholder="https://westc.github.io/predi-de-la-congre/?api=…">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ---------- settings ----------
const VERSION = '10 · 27/10/2026'; // shown at the bottom of Editar; bump when changing this file
const PALETTE = ['#fff27a','#f7a8c8','#f9b26b','#ffd6b3','#b9dd8f','#80e0e8','#bba0ec','#a9c8f0','#d0d0d0','#f3df5a','#eaa3f2','#a3dcbc'];
const PLAZA = [-17.794426, -63.134013];
const RANGOS_DEFAULT = { verde: 30, amarillo: 90 }; // days; editable in Planificar (saved in Config)
// Rough placement of the paper map over the streets: top-left, top-right, bottom-left corners.
const GUIA_DEFAULT = [[-17.79104, -63.14001], [-17.79005, -63.12651], [-17.80399, -63.13899]];
const ESTADOS = { completo: 'Completo', parcial: 'Parcial', no: 'No se hizo' };
const TABLE_NAMES = ['Bloques', 'Territorios', 'Puntos', 'Salidas', 'Informes', 'Config', 'Conductores'];

// ---------- storage helpers ----------
const store = {
  get(k, s) { try { return (s || localStorage).getItem(k); } catch (e) { return null; } },
  set(k, v, s) { try { (s || localStorage).setItem(k, v); } catch (e) {} },
};
const ss = (() => { try { return sessionStorage; } catch (e) { return null; } })();
const emptyDB = () => Object.fromEntries(TABLE_NAMES.map(t => [t, []]));

// ---------- backend ----------
// The Sheet's Apps Script web app (apps-script/Code.gs → doPost). DEMO uses a fake one kept in this browser.
const API_URL = 'https://script.google.com/macros/s/' + API_ID + '/exec';
const KEY = DEMO ? 'demo' : API_ID; // per-Sheet keys for the offline copies below
const Mock = (() => {
  let mem = null;
  const load = () => {
    if (!mem) { try { mem = JSON.parse(store.get('territorios-demo')); } catch (e) {} }
    mem = mem || emptyDB();
    TABLE_NAMES.forEach(t => { mem[t] = mem[t] || []; });
    return mem;
  };
  const persist = () => store.set('territorios-demo', JSON.stringify(mem));
  const put = (t, rows) => rows.forEach(r => {
    const row = Object.fromEntries(Object.entries(r).map(([k, v]) => [k, v == null ? '' : String(v)]));
    const i = load()[t].findIndex(x => x.id === row.id);
    if (i >= 0) mem[t][i] = row; else mem[t].push(row);
  });
  const del = (t, ids) => { load()[t] = mem[t].filter(r => ids.indexOf(r.id) < 0); };
  const who = a => {
    const w = { role: 'publicador', nombre: '', aviso: '', pinMal: false, enlaceMal: false };
    if (a.pin) {
      if (a.pin === '1234') return { role: 'admin', nombre: '' };
      Object.assign(w, { pinMal: true, aviso: 'PIN incorrecto.' });
    }
    if (a.conductor) {
      const c = load().Conductores.find(r => r.clave === a.conductor && r.activo !== 'no');
      if (c) return Object.assign(w, { role: 'conductor', nombre: c.nombre });
      Object.assign(w, { enlaceMal: true, aviso: w.aviso || 'Tu enlace de conductor ya no sirve. Pide uno nuevo al encargado del territorio.' });
    }
    return w;
  };
  const getAll = w => {
    const d = JSON.parse(JSON.stringify(load()));
    if (w.role !== 'admin') delete d.Conductores;
    return d;
  };
  const needAdmin = w => { if (w.role !== 'admin') throw new Error(w.aviso || 'Solo el administrador puede hacer esto.'); };
  const fns = {
    getAll,
    save(w, t, rows) {
      if (w.role === 'conductor' && t === 'Informes') {
        rows = rows.filter(r => !load()[t].some(x => x.id === r.id)).map(r => ({ ...r, quien: w.nombre }));
      } else {
        if (w.role !== 'admin' && t === 'Informes') throw new Error(w.aviso || 'Solo los conductores pueden enviar informes. Pide tu enlace al encargado del territorio.');
        needAdmin(w);
      }
      put(t, rows); persist(); return getAll(w);
    },
    remove(w, t, ids) { needAdmin(w); del(t, ids); persist(); return getAll(w); },
    commit(w, ch) {
      needAdmin(w);
      Object.keys(ch.save || {}).forEach(t => put(t, ch.save[t]));
      Object.keys(ch.remove || {}).forEach(t => del(t, ch.remove[t]));
      persist(); return getAll(w);
    },
  };
  return {
    call(fn, args, auth) {
      const w = who(auth);
      try { return { ok: true, data: fns[fn](w, ...args), who: w }; }
      catch (e) { return { ok: false, error: e.message, who: w }; }
    },
  };
})();

/** Calls a Code.gs function as the current user. Errors from a missing connection have e.offline = true. */
async function api(fn, ...args) {
  const auth = { pin, conductor: ckey };
  let res, out = null;
  if (DEMO) {
    await new Promise(r => setTimeout(r, 400));
    return answer(Mock.call(fn, args, auth));
  }
  try {
    // A plain-text body keeps this a "simple" request: Apps Script can't answer a CORS preflight.
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args, auth }) });
  } catch (e) {
    // The browser can't tell "no signal" from "Google didn't answer" (wrong link, not published for everyone).
    throw Object.assign(new Error(navigator.onLine === false ? 'Sin conexión. Inténtalo cuando tengas señal.'
      : 'No se pudo conectar con la hoja. Revisa la señal; si sigue pasando, pide el código QR de nuevo.'), { offline: true });
  }
  try { out = await res.json(); } catch (e) {}
  if (!out) throw new Error('La hoja no respondió. ¿La aplicación web está publicada para “Cualquier persona”?');
  return answer(out);
}
function answer(out) {
  if (out.who) setWho(out.who);
  if (!out.ok) throw new Error(out.error);
  return out.data;
}
async function busy(promise, msg) {
  $('#saving-msg').textContent = msg || 'Guardando…';
  document.body.classList.add('busy');
  try { return await promise; }
  catch (e) { toast((e && e.message) || String(e)); throw e; }
  finally { document.body.classList.remove('busy'); }
}
async function saveRows(table, rows, msg) { setDB(await busy(api('save', table, rows), msg)); }
async function removeRows(table, ids) { setDB(await busy(api('remove', table, ids), 'Borrando…')); }

// ---------- who is using the app ----------
// publicador: anyone with the app link · conductor: opened a personal link · admin: entered the PIN.
const TABS = { publicador: ['hoy'], conductor: ['hoy', 'informe'], admin: ['hoy', 'informe', 'planificar', 'editar'] };
const TAB_NAMES = { hoy: 'Hoy', informe: 'Informe', planificar: 'Planificar', editar: 'Editar' };
let pin = store.get('predi-pin-' + KEY) || '';
let ckey = CONDUCTOR_KEY;
// The last known role, so the right screens show at once (and offline) before the Sheet answers.
let WHO = safeJSON(store.get('predi-who-' + KEY), null) || { role: 'publicador', nombre: '' };
const isAdmin = () => WHO.role === 'admin';
const canReport = () => WHO.role !== 'publicador';

function setWho(w) {
  if (w.pinMal) { pin = ''; store.set('predi-pin-' + KEY, ''); }
  if (w.enlaceMal) {
    ckey = ''; store.set('predi-c-' + KEY, '');
    if (!DEMO) history.replaceState(null, '', location.pathname + '?api=' + API_ID);
  }
  if (w.aviso) toast(w.aviso, 7000);
  const changed = w.role !== WHO.role || (w.nombre || '') !== WHO.nombre;
  WHO = { role: w.role, nombre: w.nombre || '' };
  store.set('predi-who-' + KEY, JSON.stringify(WHO));
  if (changed && !TABS[WHO.role].includes(tab)) tab = 'hoy';
}

// ---------- state ----------
// SERVER is what the Sheet has; PEND holds map edits not yet sent. DB = SERVER with PEND applied.
let SERVER = emptyDB(), PEND = { save: {}, remove: {} }, DB = emptyDB();
let BL = [], BYID = {}, LAST = {}, TCOLOR = {}, CONFIG = {};
let tab = 'hoy', colorBy = 'territorio', editSub = 'bloques', showLogin = false;
let plan = newPlan();
let infFecha = ymd(new Date()), infForm = {};
let editSel = null, lastSaved = null, addingPunto = false, shapeLayer = null;
let verSalida = START_SALIDA; // salida shown in Mapa (also from a shared link)
let guide = null, guideAdjust = false, guideHandles = [];

function newPlan() {
  const d = new Date(); d.setDate(d.getDate() + 1);
  return { id: '', fecha: ymd(d), hora: store.get('territorios-hora') || '', punto: '', conductor: '', notas: '', bloques: [], notasB: {} };
}

// The last data from the Sheet is kept in this browser, so the app opens at once and works without signal.
function setDB(data) { SERVER = data; store.set('predi-datos-' + KEY, JSON.stringify(data)); rebuild(); }

// Informes sent without signal wait here and go out by themselves when there is a connection.
function cola() { return safeJSON(store.get('predi-cola-' + KEY), null) || []; }
function setCola(rows) { store.set('predi-cola-' + KEY, JSON.stringify(rows)); }
let flushing = false;
async function flushCola(manual) {
  const rows = cola();
  if (!rows.length || flushing || (!manual && !canReport())) return;
  flushing = true;
  try {
    const data = await api('save', 'Informes', rows);
    const sent = new Set(rows.map(r => r.id));
    setCola(cola().filter(r => !sent.has(r.id)));
    setDB(data);
    toast(rows.length === 1 ? 'Se envió el informe que esperaba señal.' : 'Se enviaron ' + rows.length + ' informes que esperaban señal.');
  } catch (e) {
    if (manual || !e.offline) toast(e.message);
  } finally {
    flushing = false;
  }
}
window.addEventListener('online', () => flushCola());
setInterval(() => flushCola(), 60000);

function rebuild() {
  DB = {};
  TABLE_NAMES.forEach(t => {
    const rm = PEND.remove[t] || [], sv = PEND.save[t] || {};
    DB[t] = (SERVER[t] || []).filter(r => rm.indexOf(r.id) < 0 && !sv[r.id]).concat(Object.values(sv));
  });
  const waiting = cola().filter(r => !DB.Informes.some(x => x.id === r.id));
  DB.Informes = DB.Informes.concat(waiting);
  BL = DB.Bloques.map(b => ({ ...b, t: +b.territorio, n: +b.bloque, coords: safeJSON(b.coords, []) }))
    .sort((a, b) => a.t - b.t || a.n - b.n);
  BYID = Object.fromEntries(BL.map(b => [b.id, b]));
  TCOLOR = Object.fromEntries(DB.Territorios.map(t => [t.id, t.color]));
  CONFIG = Object.fromEntries(DB.Config.map(c => [c.id, c.valor]));
  LAST = {};
  sortedInformes().forEach(r => { if (r.estado !== 'no') LAST[r.bloque] = r; });
  renderAll();
}

function pendingCount() {
  let n = 0;
  Object.values(PEND.save).forEach(rows => { n += Object.keys(rows).length; });
  Object.values(PEND.remove).forEach(ids => { n += ids.length; });
  return n;
}
function stage(table, row) {
  (PEND.save[table] = PEND.save[table] || {})[row.id] = row;
  if (PEND.remove[table]) PEND.remove[table] = PEND.remove[table].filter(id => id !== row.id);
  rebuild();
}
function stageRemove(table, id) {
  if (PEND.save[table]) delete PEND.save[table][id];
  if ((SERVER[table] || []).some(r => r.id === id)) (PEND.remove[table] = PEND.remove[table] || []).push(id);
  rebuild();
}
async function commitAll() {
  const n = pendingCount();
  const changes = { save: {}, remove: PEND.remove };
  Object.keys(PEND.save).forEach(t => { changes.save[t] = Object.values(PEND.save[t]); });
  const data = await busy(api('commit', changes), 'Guardando ' + n + (n === 1 ? ' cambio…' : ' cambios…'));
  PEND = { save: {}, remove: {} };
  setDB(data);
  toast('Cambios guardados.');
}
function discardAll() {
  const n = pendingCount();
  if (!confirm('¿Descartar ' + n + (n === 1 ? ' cambio' : ' cambios') + ' sin guardar?')) return;
  endShape();
  PEND = { save: {}, remove: {} };
  editSel = null; lastSaved = null;
  rebuild();
}

// ---------- utils ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function safeJSON(s, d) { try { return JSON.parse(s); } catch (e) { return d; } }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmt(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  const dias = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  return dias[new Date(y, m - 1, d).getDay()] + ' ' + String(d).padStart(2, '0') + '/' + String(m).padStart(2, '0') + '/' + y;
}
function daysSince(s) { const [y, m, d] = s.split('-').map(Number); return Math.floor((Date.now() - new Date(y, m - 1, d)) / 864e5); }
function ago(s) { const d = daysSince(s); return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace ' + d + ' días'; }
function sortedInformes() { return DB.Informes.slice().sort((a, b) => (a.fecha + a.creado).localeCompare(b.fecha + b.creado)); }
function tColor(t) { return TCOLOR[t] || PALETTE[(t - 1 + PALETTE.length) % PALETTE.length]; }
function rangos() {
  return { verde: +CONFIG.dias_verde || RANGOS_DEFAULT.verde, amarillo: +CONFIG.dias_amarillo || RANGOS_DEFAULT.amarillo };
}
function statusColor(id) {
  const r = LAST[id];
  if (!r) return '#c4c4c4';
  if (r.estado === 'parcial') return '#f39c12';
  const d = daysSince(r.fecha), g = rangos();
  return d <= g.verde ? '#2ecc71' : d <= g.amarillo ? '#f1c40f' : '#e74c3c';
}
function bName(b) { return b ? 'T' + b.t + ' · Manzana ' + b.n : '(manzana borrada)'; }
function bShort(b) { return 'T' + b.t + '·M' + b.n; }
function describe(ids) {
  const by = {};
  ids.map(id => BYID[id]).filter(Boolean).forEach(b => (by[b.t] = by[b.t] || []).push(b.n));
  return Object.keys(by).sort((a, b) => a - b).map(t => 'T' + t + ': ' + by[t].sort((a, b) => a - b).join(', ')).join(' · ') || '—';
}
function when(s) { return fmt(s.fecha) + (s.hora ? ' · ' + s.hora : ''); }
const bySalidaTime = (a, b) => (a.fecha + (a.hora || '')).localeCompare(b.fecha + (b.hora || ''));
function salidaBlocks(s) { return (s.bloques || '').split(',').filter(Boolean); }
function salidaNotes(s) { return safeJSON(s.notasBloques, {}) || {}; }
function nextSalidaFor(id) {
  const hoy = ymd(new Date());
  return DB.Salidas.filter(s => s.fecha >= hoy && salidaBlocks(s).includes(id)).sort(bySalidaTime)[0];
}
function puntoOf(s) { return DB.Puntos.find(p => p.letra === s.punto); }
function puntoName(letra) {
  const p = DB.Puntos.find(p => p.letra === letra);
  return p ? p.letra + ' – ' + p.nombre : letra;
}
function informeIcon(r) {
  if (!r) return '<span class="muted">—</span>';
  return { completo: '<span class="done">✓</span>', parcial: '<span class="part">◐</span>', no: '<span class="not">✕</span>' }[r.estado] || '';
}
function centroid(coords) {
  const n = coords.length || 1;
  return [coords.reduce((s, c) => s + c[0], 0) / n, coords.reduce((s, c) => s + c[1], 0) / n];
}
let toastTimer;
function toast(msg, ms) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms || 3200);
}

// ---------- map ----------
const map = L.map('map', { zoomControl: true }).setView(PLAZA, 16);
const BASES = {
  calles: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, crossOrigin: true, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }),
  satelite: L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, crossOrigin: true, attribution: 'Imágenes © Esri, Maxar, Earthstar Geographics',
    }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, crossOrigin: true }),
  ]),
};
let base = store.get('territorios-base') === 'satelite' ? 'satelite' : 'calles';
BASES[base].addTo(map);

const BaseControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const div = L.DomUtil.create('div', 'ctl');
    div.innerHTML = '<button data-v="calles">Calles</button><button data-v="satelite">Satélite</button>';
    L.DomEvent.disableClickPropagation(div);
    div.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setBase(b.dataset.v); });
    this._div = div; this.refresh();
    return div;
  },
  refresh() { this._div.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === base)); },
});
const baseCtl = new BaseControl().addTo(map);
function setBase(v) {
  if (v === base) return;
  map.removeLayer(BASES[base]); base = v; BASES[base].addTo(map);
  store.set('territorios-base', v); baseCtl.refresh(); renderMap();
}

// "Where am I" button: blue dot that follows the phone's GPS.
let locating = false, firstFix = false, meDot = null, meAcc = null;
const LocControl = L.Control.extend({
  options: { position: 'topleft' },
  onAdd() {
    const div = L.DomUtil.create('div', 'ctl ctl-loc leaflet-bar');
    div.innerHTML = '<button title="Mi ubicación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>';
    L.DomEvent.disableClickPropagation(div);
    div.querySelector('button').addEventListener('click', locate);
    this._btn = div.querySelector('button');
    return div;
  },
});
const locCtl = new LocControl().addTo(map);
function locate() {
  if (!navigator.geolocation) return toast('Este navegador no puede dar la ubicación.');
  if (locating && meDot) { map.setView(meDot.getLatLng(), Math.max(map.getZoom(), 17)); return; }
  locating = true; firstFix = true; locCtl._btn.classList.add('on');
  toast('Buscando tu ubicación…');
  map.locate({ watch: true, enableHighAccuracy: true, setView: false, timeout: 20000 });
}
map.on('locationfound', e => {
  if (!meDot) {
    meAcc = L.circle(e.latlng, { radius: e.accuracy, color: '#1a73e8', weight: 1, fillOpacity: 0.12, interactive: false, pmIgnore: true }).addTo(map);
    meDot = L.circleMarker(e.latlng, { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1, interactive: false, pmIgnore: true }).addTo(map);
  } else {
    meDot.setLatLng(e.latlng); meAcc.setLatLng(e.latlng).setRadius(e.accuracy);
  }
  if (firstFix) { firstFix = false; map.setView(e.latlng, Math.max(map.getZoom(), 17)); }
});
map.on('locationerror', e => {
  locating = false; locCtl._btn.classList.remove('on'); map.stopLocate();
  toast(e.code === 1
    ? 'No se permitió la ubicación. Si el mapa está dentro de otra página (Google Sites), toca “Abrir aparte ↗” arriba e inténtalo allí.'
    : 'No se pudo obtener la ubicación. Inténtalo de nuevo al aire libre.', 8000);
});

map.createPane('guia').style.zIndex = 450;
map.getPane('guia').style.pointerEvents = 'none';
const gManzanas = L.featureGroup().addTo(map);
const gBloques = L.featureGroup().addTo(map);
const gTerr = L.layerGroup().addTo(map);
const gPuntos = L.layerGroup().addTo(map);
const gTemp = L.layerGroup().addTo(map);
map.pm.setLang('es');
map.pm.setGlobalOptions({ snappable: true, snapDistance: 15, allowSelfIntersection: false });
const zoomClass = () => document.body.classList.toggle('far', map.getZoom() < 16);
map.on('zoomend', zoomClass); zoomClass();

function highlightSet() {
  if (tab === 'informe') return new Set(Object.keys(infForm));
  if (tab === 'hoy') {
    const list = shownSalida() ? [shownSalida()] : todaySalidas();
    return list.length ? new Set(list.flatMap(salidaBlocks)) : null;
  }
  if (tab === 'planificar') return new Set(plan.bloques);
  if (tab === 'editar' && editSel && editSel.kind === 'bloque') return new Set([editSel.id]);
  return null;
}

function renderMap() {
  if (shapeLayer) return; // don't redraw while a shape is being edited
  gBloques.clearLayers(); gTerr.clearLayers(); gPuntos.clearLayers(); gManzanas.clearLayers(); gTemp.clearLayers();
  const hi = highlightSet();
  const sat = base === 'satelite';
  const unsaved = PEND.save.Bloques || {};
  const byStatus = colorBy === 'estado' && tab === 'planificar';
  BL.forEach(b => {
    const sel = hi && hi.has(b.id);
    const dim = hi && !sel && (tab === 'informe' || tab === 'hoy');
    const poly = L.polygon(b.coords, {
      color: sel ? '#c0392b' : unsaved[b.id] ? '#e67e22' : sat ? '#fff' : '#4a4a4a',
      weight: sel ? 3.5 : unsaved[b.id] ? 2.5 : sat ? 1.5 : 1,
      dashArray: unsaved[b.id] && !sel ? '6 4' : null,
      fillColor: byStatus ? statusColor(b.id) : tColor(b.t),
      fillOpacity: dim ? (sat ? 0.1 : 0.25) : sat ? 0.4 : 0.7,
    });
    poly.bindTooltip(String(b.n), { permanent: true, direction: 'center', className: 'lbl-b' });
    poly.on('click', e => onBlockClick(b, e));
    poly._bid = b.id;
    gBloques.addLayer(poly);
  });
  const terr = {};
  BL.forEach(b => (terr[b.t] = terr[b.t] || []).push(centroid(b.coords)));
  Object.keys(terr).forEach(t => {
    const m = L.marker(centroid(terr[t]), {
      icon: L.divIcon({ className: 'lbl-t', html: '<span>' + t + '</span>', iconSize: [0, 0] }),
      keyboard: false, pmIgnore: true,
    });
    m.on('click', e => addingPunto ? placePunto(e.latlng) : onTerritoryClick(+t));
    gTerr.addLayer(m);
  });
  DB.Puntos.forEach(p => {
    const m = L.marker([+p.lat, +p.lng], {
      icon: L.divIcon({ className: 'lbl-p', html: '<span>' + esc(p.letra) + '</span>', iconSize: [0, 0] }),
      draggable: tab === 'editar' && isAdmin() && editSub === 'puntos', pmIgnore: true,
    });
    m.bindTooltip(esc(p.nombre), { direction: 'top', offset: [0, -12] });
    m.on('click', () => { if (tab === 'editar' && isAdmin()) { editSub = 'puntos'; editSel = { kind: 'punto', id: p.id }; renderAll(); } });
    m.on('dragend', () => { const ll = m.getLatLng(); stage('Puntos', { ...p, lat: ll.lat.toFixed(6), lng: ll.lng.toFixed(6) }); });
    gPuntos.addLayer(m);
  });
  if (tab === 'editar' && editSel && editSel.kind === 'punto' && !editSel.id) {
    gTemp.addLayer(L.marker([+editSel.lat, +editSel.lng], { icon: L.divIcon({ className: 'lbl-p', html: '<span style="background:#c0392b">?</span>', iconSize: [0, 0] }), pmIgnore: true, interactive: false }));
  }
  if (tab === 'editar' && isAdmin() && editSub === 'bloques') {
    (window.MANZANAS || []).filter(c => !BYID[c.id]).forEach(c => {
      const sel = editSel && editSel.id === c.id;
      const poly = L.polygon(sel ? editSel.coords : c.coords, { color: sel ? '#c0392b' : sat ? '#fff' : '#777', weight: sel ? 3.5 : 1, dashArray: sel ? null : '4 3', fillColor: '#999', fillOpacity: sel ? 0.45 : 0.18 });
      poly.on('click', () => selectForEdit({ kind: 'manzana', id: c.id, coords: c.coords }));
      poly._bid = c.id;
      gManzanas.addLayer(poly);
    });
    if (editSel && editSel.kind === 'nuevo') {
      const poly = L.polygon(editSel.coords, { color: '#c0392b', weight: 3.5, fillOpacity: 0.3 });
      poly._bid = 'nuevo';
      gTemp.addLayer(poly);
    }
  }
}

function onBlockClick(b, e) {
  if (addingPunto) return placePunto(e.latlng);
  if (tab === 'hoy') {
    const hist = DB.Informes.filter(r => r.bloque === b.id).sort((a, c) => (c.fecha + c.creado).localeCompare(a.fecha + a.creado)).slice(0, 6);
    const last = LAST[b.id], next = nextSalidaFor(b.id);
    const nextNote = next && salidaNotes(next)[b.id];
    L.popup().setLatLng(e.latlng).setContent(
      '<b>' + esc(bName(b)) + '</b>' + (b.notas ? '<div class="muted">' + esc(b.notas) + '</div>' : '') +
      '<div>' + (last ? 'Último: ' + esc(ESTADOS[last.estado]) + (last.porcentaje ? ' ' + esc(last.porcentaje) + '%' : '') + ' — ' + fmt(last.fecha) + ' (' + ago(last.fecha) + ')' : 'Sin informes todavía') + '</div>' +
      (next ? '<div>Asignada: ' + when(next) + '</div>' + (nextNote ? '<div class="pin-note">📌 ' + esc(nextNote) + '</div>' : '') : '') +
      (hist.length ? '<ul class="hist">' + hist.map(r => '<li>' + informeIcon(r) + ' ' + fmt(r.fecha) + (r.porcentaje ? ' · ' + esc(r.porcentaje) + '%' : '') + (r.nota ? ' · ' + esc(r.nota) : '') + (r.quien ? ' <span class="muted">(' + esc(r.quien) + ')</span>' : '') + '</li>').join('') + '</ul>' : '')
    ).openOn(map);
  } else if (tab === 'informe') {
    if (!infForm[b.id]) infForm[b.id] = { salida: '', estado: '', porcentaje: '', nota: '' };
    renderAll();
    const row = document.querySelector('[data-row="' + b.id + '"]');
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else if (tab === 'planificar') {
    if (!isAdmin()) return;
    const i = plan.bloques.indexOf(b.id);
    if (i >= 0) plan.bloques.splice(i, 1); else plan.bloques.push(b.id);
    renderAll();
  } else if (tab === 'editar' && isAdmin()) {
    editSub = 'bloques'; selectForEdit({ kind: 'bloque', id: b.id });
  }
}

// ---------- shape editing (shapeLayer = the polygon whose corners are being dragged) ----------
function selectForEdit(sel) {
  if (shapeLayer && editSel && editSel.id === sel.id) return; // tapping the shape being edited
  keepShape();
  editSel = sel;
  renderAll();
}
function startShape() {
  const id = editSel.kind === 'nuevo' ? 'nuevo' : editSel.id;
  shapeLayer = [gBloques, gManzanas, gTemp].flatMap(g => g.getLayers()).find(l => l._bid === id);
  if (!shapeLayer) return;
  shapeLayer.pm.enable({ snappable: true });
  toast('Arrastra los vértices. Toca “Terminar forma” al acabar.');
}
/** Stops editing and returns the new corners (or null if nothing was being edited). */
function endShape() {
  if (!shapeLayer) return null;
  const coords = shapeLayer.getLatLngs()[0].map(ll => [+ll.lat.toFixed(6), +ll.lng.toFixed(6)]);
  shapeLayer.pm.disable(); shapeLayer = null;
  return coords;
}
/** Stops editing and keeps the new shape: staged for a saved manzana, held in editSel otherwise. */
function keepShape() {
  const coords = endShape();
  if (!coords) return;
  if (editSel.kind === 'bloque') stage('Bloques', { ...DB.Bloques.find(x => x.id === editSel.id), coords: JSON.stringify(coords) });
  else editSel.coords = coords;
}

function toggleTerritory(t) {
  const ids = BL.filter(b => b.t === t).map(b => b.id);
  const all = ids.every(id => plan.bloques.includes(id));
  plan.bloques = all ? plan.bloques.filter(id => !ids.includes(id)) : plan.bloques.concat(ids.filter(id => !plan.bloques.includes(id)));
  renderAll();
}
function zoomTerritory(t) {
  map.fitBounds(L.latLngBounds(BL.filter(b => b.t === t).flatMap(b => b.coords)), { padding: [30, 30] });
}
function onTerritoryClick(t) {
  if (tab === 'planificar' && isAdmin()) toggleTerritory(t); else zoomTerritory(t);
}

// While adding a punto, a tap anywhere (also on a manzana or a territory number) places it.
function placePunto(ll) {
  addingPunto = false;
  editSel = { kind: 'punto', id: '', lat: ll.lat.toFixed(6), lng: ll.lng.toFixed(6) };
  renderAll();
}
map.on('click', e => { if (addingPunto) placePunto(e.latlng); });

map.on('pm:create', e => {
  const coords = e.layer.getLatLngs()[0].map(ll => [+ll.lat.toFixed(6), +ll.lng.toFixed(6)]);
  map.removeLayer(e.layer);
  editSel = { kind: 'nuevo', id: '', coords };
  renderAll();
});

// ---------- guide image (the paper map, laid over the streets) ----------
const GuideImage = L.Layer.extend({
  initialize(url, corners) { this._url = url; this._c = corners.map(c => L.latLng(c)); },
  onAdd(m) {
    this._img = L.DomUtil.create('img', 'guide-img', m.getPane('guia'));
    this._img.onload = () => this._update();
    this._img.src = this._url;
    this._img.style.opacity = this._op == null ? 0.5 : this._op;
    m.on('zoom viewreset zoomend', this._update, this);
    this._update();
  },
  onRemove(m) { this._img.remove(); m.off('zoom viewreset zoomend', this._update, this); },
  corners() { return this._c.map(c => [+c.lat.toFixed(6), +c.lng.toFixed(6)]); },
  setCorners(c) { this._c = c.map(x => L.latLng(x)); this._update(); },
  setOpacity(o) { this._op = o; if (this._img) this._img.style.opacity = o; },
  _update() {
    if (!this._map || !this._img || !this._img.naturalWidth) return;
    const [p0, p1, p2] = this._c.map(c => this._map.latLngToLayerPoint(c));
    const w = this._img.naturalWidth, h = this._img.naturalHeight;
    this._img.style.transform = 'matrix(' + [(p1.x - p0.x) / w, (p1.y - p0.y) / w, (p2.x - p0.x) / h, (p2.y - p0.y) / h, p0.x, p0.y].join(',') + ')';
  },
});

function loadGuide(file) {
  const reader = new FileReader();
  reader.onload = () => {
    if (guide) map.removeLayer(guide);
    guide = new GuideImage(reader.result, safeJSON(CONFIG.guia, null) || GUIA_DEFAULT).addTo(map);
    renderAll();
  };
  reader.readAsDataURL(file);
}

function setGuideAdjust(on) {
  guideAdjust = on;
  guideHandles.forEach(h => map.removeLayer(h));
  guideHandles = [];
  if (!on || !guide) return;
  const icon = cls => L.divIcon({ className: 'handle ' + cls, html: '<span></span>', iconSize: [0, 0] });
  const c = guide.corners();
  const mid = () => { const k = guide.corners(); return [(k[1][0] + k[2][0]) / 2, (k[1][1] + k[2][1]) / 2]; };
  c.forEach((pt, i) => {
    const h = L.marker(pt, { draggable: true, icon: icon('corner'), pmIgnore: true }).addTo(map);
    h.on('drag', () => { const k = guide.corners(); const ll = h.getLatLng(); k[i] = [ll.lat, ll.lng]; guide.setCorners(k); center.setLatLng(mid()); });
    guideHandles.push(h);
  });
  const center = L.marker(mid(), { draggable: true, icon: icon('center'), pmIgnore: true }).addTo(map);
  let start;
  center.on('dragstart', () => { start = { ll: center.getLatLng(), k: guide.corners() }; });
  center.on('drag', () => {
    const ll = center.getLatLng(), dl = ll.lat - start.ll.lat, dg = ll.lng - start.ll.lng;
    const k = start.k.map(p => [p[0] + dl, p[1] + dg]);
    guide.setCorners(k);
    guideHandles.slice(0, 3).forEach((h, i) => h.setLatLng(k[i]));
  });
  guideHandles.push(center);
}

      drawCircle: false, drawText: false, editMode: false, dragMode: false, cutPolygon: false, removalMode: false, rotateMode: false });

// "Install the app": a button when the browser offers its own prompt (it doesn't always, e.g. desktop Chrome

let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (tab === 'hoy') renderAll(); });
function installHint() {
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) return '';
  if (installEvt) return '<div class="actions"><button class="b" data-act="install">📲 Instalar la app</button></div>';
  const ua = navigator.userAgent;
  const how = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'en Safari, botón Compartir → “Agregar a inicio”.'
    : /Android/.test(ua) ? 'menú ⋮ del navegador → “Instalar app” (o “Agregar a la pantalla principal”).'
    : /Edg\//.test(ua) ? 'menú ⋯ de Edge → Aplicaciones → “Instalar este sitio como aplicación”.'
    : /Chrome\//.test(ua) ? 'el ícono de instalar al final de la barra de direcciones, o menú ⋮ → Transmitir, guardar y compartir → “Instalar página como app”.'
    : /Safari\//.test(ua) ? 'en Safari, menú Archivo → “Agregar al Dock”.'
    : '';
  return how ? '<p class="muted">📲 Para instalar la app: ' + how + '</p>' : '';
}

function shownSalida() { return verSalida && DB.Salidas.find(s => s.id === verSalida); }
function salidaDest(s) {
  const p = puntoOf(s);
  if (p) return [+p.lat, +p.lng];
  const bs = salidaBlocks(s).map(id => BYID[id]).filter(Boolean);
  return bs.length ? centroid(bs.map(b => centroid(b.coords))) : null;
}
function directionsUrl(ll) { return 'https://www.google.com/maps/dir/?api=1&destination=' + ll[0].toFixed(6) + ',' + ll[1].toFixed(6); }
function salidaLink(s) { return DEMO ? '' : location.origin + location.pathname + '?api=' + API_ID + '&salida=' + encodeURIComponent(s.id); }
function todaySalidas() { const hoy = ymd(new Date()); return DB.Salidas.filter(s => s.fecha === hoy).sort(bySalidaTime); }
function salidaPts(s) {
  const pts = salidaBlocks(s).map(id => BYID[id]).filter(Boolean).flatMap(b => b.coords);
  const p = puntoOf(s);
  if (p) pts.push([+p.lat, +p.lng]);
  return pts;
}
function fitSalida(s) {
  const pts = salidaPts(s);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 18 });
}

function territoryRows() {
  const by = {};

  return Object.keys(by).map(t => {
    const bs = by[t];
    const days = bs.map(b => LAST[b.id] ? daysSince(LAST[b.id].fecha) : Infinity);
    return { t: +t, n: bs.length, oldest: Math.max(...days), parciales: bs.filter(b => LAST[b.id] && LAST[b.id].estado === 'parcial').length, ids: bs.map(b => b.id) };
  }).sort((a, b) => b.oldest - a.oldest || a.t - b.t);
}

// ---------- conductor links ----------
function newClave() {
  const b = crypto.getRandomValues(new Uint8Array(18));
  return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_');
}
function conductorLink(c) {
  return location.origin + location.pathname + (DEMO ? '?demo&c=' : '?api=' + API_ID + '&c=') + c.clave;
}
let qrLib = null;
function loadQr() {
  qrLib = qrLib || new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    el.onload = () => res(window.qrcode);
    el.onerror = () => { qrLib = null; rej(new Error('No se pudo cargar el código QR.')); };
    document.head.appendChild(el);
  });
  return qrLib;
}

function salidaText(s) {
  const p = puntoOf(s), dest = salidaDest(s), notes = salidaNotes(s), link = salidaLink(s);
  return ['Salida de predicación — ' + when(s),
    s.punto ? 'Punto de salida: ' + puntoName(s.punto) : '',
    dest ? 'Cómo llegar: ' + directionsUrl(dest) : '',
    s.conductor ? 'Conductor: ' + s.conductor : '',
    'Manzanas: ' + describe(salidaBlocks(s)),
    ...Object.keys(notes).filter(id => BYID[id] && notes[id]).map(id => '📌 ' + bShort(BYID[id]) + ': ' + notes[id]),
    s.notas || '',
    link ? 'Ver en el mapa: ' + link : '',
  ].filter(Boolean).join('\n');
}

const TILE_URL = {
  calles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
  satelite: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}'],
};
function loadImg(url) {
  return new Promise(res => {
    const img = new Image();
    const t = setTimeout(() => res(null), 8000);
    img.crossOrigin = 'anonymous'; // tiles without CORS are skipped, so the canvas can still be exported
    img.onload = () => { clearTimeout(t); res(img); };
    img.onerror = () => { clearTimeout(t); res(null); };
    img.src = url;
  });
}
function wrapLines(cx, text, width) {
  const out = [];
  String(text).split('\n').forEach(par => {
    let line = '';
    par.split(' ').forEach(w => {
      const t = line ? line + ' ' + w : w;
      if (cx.measureText(t).width > width && line) { out.push(line); line = w; } else line = t;
    });
    out.push(line);
  });
  return out;
}

/** Draws the salida as a PNG: details on top, a map of its manzanas and meeting point below. */
async function salidaImage(s) {
  const W = 1080, PAD = 48, MAPH = 860;
  const cv = document.createElement('canvas'), cx = cv.getContext('2d');
  const notes = salidaNotes(s);
  const rows = [
    ['bold 50px system-ui,sans-serif', '#1d2330', when(s)],
    s.punto && ['600 36px system-ui,sans-serif', '#1d2330', '📍 ' + puntoName(s.punto)],
    s.conductor && ['32px system-ui,sans-serif', '#444', 'Conductor: ' + s.conductor],
    ['32px system-ui,sans-serif', '#444', 'Manzanas: ' + describe(salidaBlocks(s))],
    ...Object.keys(notes).filter(id => BYID[id] && notes[id]).map(id => ['30px system-ui,sans-serif', '#6b4e00', '📌 ' + bShort(BYID[id]) + ': ' + notes[id]]),
    s.notas && ['italic 30px system-ui,sans-serif', '#444', s.notas],
  ].filter(Boolean);
  const laid = rows.map(([font, color, text]) => {
    cx.font = font;
    return { font, color, lines: wrapLines(cx, text, W - 2 * PAD), h: parseInt(font.match(/(\d+)px/)[1], 10) * 1.3 };
  });
  const headH = PAD + laid.reduce((t, r) => t + r.lines.length * r.h + 6, 0) + PAD / 2;

  const bs = salidaBlocks(s).map(id => BYID[id]).filter(Boolean);
  const p = puntoOf(s);
  const pts = bs.flatMap(b => b.coords).concat(p ? [[+p.lat, +p.lng]] : []);
  const mapH = pts.length ? MAPH : 0;
  cv.width = W; cv.height = headH + mapH + 50;
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, cv.height);
  let y = PAD;
  laid.forEach(r => {
    cx.font = r.font; cx.fillStyle = r.color; cx.textBaseline = 'top';
    r.lines.forEach(l => { cx.fillText(l, PAD, y); y += r.h; });
    y += 6;
  });

  if (mapH) {
    const bounds = L.latLngBounds(pts);
    let z = 18;
    for (; z > 12; z--) {
      const a = map.project(bounds.getNorthWest(), z), b = map.project(bounds.getSouthEast(), z);
      if (b.x - a.x <= W - 160 && b.y - a.y <= mapH - 160) break;
    }
    const c = map.project(bounds.getCenter(), z);
    const ox = c.x - W / 2, oy = c.y - mapH / 2;
    const xy = ll => { const q = map.project(L.latLng(ll), z); return [q.x - ox, headH + q.y - oy]; };
    const jobs = [];
    TILE_URL[base].forEach((tpl, layer) => {
      for (let tx = Math.floor(ox / 256); tx <= Math.floor((ox + W) / 256); tx++)
        for (let ty = Math.floor(oy / 256); ty <= Math.floor((oy + mapH) / 256); ty++)
          jobs.push(loadImg(tpl.replace('{z}', z).replace('{x}', tx).replace('{y}', ty)).then(img => ({ img, tx, ty, layer })));
    });
    const tiles = await Promise.all(jobs);
    cx.save();
    cx.beginPath(); cx.rect(0, headH, W, mapH); cx.clip();
    cx.fillStyle = '#e8e8e8'; cx.fillRect(0, headH, W, mapH);
    tiles.sort((a, b) => a.layer - b.layer).forEach(t => { if (t.img) cx.drawImage(t.img, t.tx * 256 - ox, headH + t.ty * 256 - oy); });
    const sat = base === 'satelite', mine = new Set(bs.map(b => b.id));
    const poly = (coords, fill, stroke, lw, alpha) => {
      cx.beginPath();
      coords.forEach((ll, i) => { const [px, py] = xy(ll); i ? cx.lineTo(px, py) : cx.moveTo(px, py); });
      cx.closePath();
      if (fill) { cx.globalAlpha = alpha; cx.fillStyle = fill; cx.fill(); cx.globalAlpha = 1; }
      cx.lineWidth = lw; cx.strokeStyle = stroke; cx.stroke();
    };
    BL.filter(b => !mine.has(b.id)).forEach(b => poly(b.coords, sat ? null : '#ffffff', sat ? 'rgba(255,255,255,.6)' : 'rgba(0,0,0,.35)', 1.5, 0.35));
    bs.forEach(b => poly(b.coords, tColor(b.t), '#c0392b', 5, sat ? 0.55 : 0.75));
    const label = (text, px, py, font, fill) => {
      cx.font = font; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.lineWidth = 6; cx.strokeStyle = '#fff'; cx.strokeText(text, px, py);
      cx.fillStyle = fill; cx.fillText(text, px, py);
    };
    bs.forEach(b => { const [px, py] = xy(centroid(b.coords)); label(bShort(b), px, py, 'bold 26px system-ui,sans-serif', '#111'); });
    if (p) {
      const [px, py] = xy([+p.lat, +p.lng]);
      cx.beginPath(); cx.arc(px, py, 26, 0, 2 * Math.PI);
      cx.fillStyle = '#1d2330'; cx.fill(); cx.lineWidth = 5; cx.strokeStyle = '#fff'; cx.stroke();
      cx.font = 'bold 26px system-ui,sans-serif'; cx.fillStyle = '#fff'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillText(p.letra, px, py + 1);
      label(p.nombre, px, py - 46, 'bold 26px system-ui,sans-serif', '#1d2330');
    }
    cx.restore();
  }
  cx.textAlign = 'left'; cx.textBaseline = 'middle'; cx.font = '22px system-ui,sans-serif'; cx.fillStyle = '#6b7280';
  cx.fillText('Territorios · La Villa', PAD, cv.height - 25);
  cx.textAlign = 'right';
  cx.fillText(mapH ? (base === 'satelite' ? '© Esri, Maxar' : '© OpenStreetMap') : '', W - PAD, cv.height - 25);
  return new Promise(res => cv.toBlob(res, 'image/png'));
}

async function openShare(s) {
  const blob = await salidaImage(s);
  const text = salidaText(s);
  shareData = { blob, text, name: 'salida-' + s.fecha + '.png' };
  const url = URL.createObjectURL(blob);
  const canFiles = !!(navigator.canShare && navigator.canShare({ files: [new File([blob], shareData.name, { type: 'image/png' })] }));
  $('#share .box').innerHTML = '<div class="row-t"><span>Compartir salida</span><button class="b small" data-act="shareclose">✕</button></div>' +
    '<img src="' + url + '" alt="Salida ' + esc(when(s)) + '">' +
    '<p class="muted">En el celular también puedes mantener presionada la imagen para guardarla o compartirla.</p>' +
    '<div class="actions">' + (canFiles || navigator.share ? '<button class="b primary" data-act="sharenative">Compartir…</button>' : '') +
    '<a class="b" href="https://wa.me/?text=' + encodeURIComponent(text) + '" target="_blank" rel="noopener">WhatsApp (texto)</a>' +
    '<a class="b" href="' + url + '" download="' + shareData.name + '">Descargar imagen</a></div>' +
    '<label>Texto</label><textarea rows="7" readonly onclick="this.select()">' + esc(text) + '</textarea>';
  $('#share').classList.add('show');
}

function shareNative() {
  const file = new File([shareData.blob], shareData.name, { type: 'image/png' });
  const data = navigator.canShare && navigator.canShare({ files: [file] }) ? { files: [file], text: shareData.text } : { text: shareData.text };
  navigator.share(data).catch(e => {
    if (e && e.name === 'AbortError') return; // the person closed the share sheet
    toast('Aquí no se puede compartir directo. Mantén presionada la imagen, usa “Descargar”, o abre la página aparte ↗.', 7000);
  });
}

  planedit(el) {
    const s = DB.Salidas.find(x => x.id === el.dataset.id);
    plan = { id: s.id, fecha: s.fecha, hora: s.hora || '', punto: s.punto, conductor: s.conductor, notas: s.notas, bloques: salidaBlocks(s).filter(id => BYID[id]), notasB: salidaNotes(s) };
    renderAll(); panel.scrollTop = 0;
  },
  async plandel(el) {
    const s = DB.Salidas.find(x => x.id === el.dataset.id);
    if (confirm('¿Borrar la salida del ' + when(s) + '? (Los informes ya enviados se conservan.)')) await removeRows('Salidas', [s.id]);
  },
  sub(el) { editSub = el.dataset.v; editSel = null; addingPunto = false; renderAll(); },
  async cadd() {
    const nombre = $('#c-nombre').value.trim();
    if (!nombre) return toast('Escribe el nombre del conductor.');
    const c = { id: uid(), nombre, clave: newClave(), activo: 'si', creado: new Date().toISOString() };
    await saveRows('Conductores', [c], 'Agregando…');
    openConductorShare(c);
  },
  csend(el) { openConductorShare(DB.Conductores.find(c => c.id === el.dataset.id)); },
  async ctoggle(el) {
    const c = DB.Conductores.find(x => x.id === el.dataset.id);
    await saveRows('Conductores', [{ ...c, activo: c.activo === 'no' ? 'si' : 'no' }]);
  },
  async cdel(el) {
    const c = DB.Conductores.find(x => x.id === el.dataset.id);
    if (confirm('¿Borrar a ' + c.nombre + '? Su enlace dejará de servir. (Sus informes se conservan.)')) await removeRows('Conductores', [c.id]);
  },
  appshare() { openAppShare(); },
  sharetext() { navigator.share({ text: shareData.text }).catch(() => {}); },
  async copylink() {
    const el = $('#share-link');
    try { await navigator.clipboard.writeText(el.value); } catch (e) { el.select(); document.execCommand('copy'); }
    toast('Enlace copiado.');
  },
  bsave() {
    const t = +$('#e-t').value, n = +$('#e-n').value;
    if (!(t > 0 && n > 0)) return toast('Pon el número de territorio y de manzana.');
    const dup = BL.find(b => b.t === t && b.n === n && b.id !== editSel.id);
    if (dup && !confirm('Ya existe T' + t + ' · Manzana ' + n + '. ¿Seguir de todos modos?')) return;
    const id = editSel.id || uid();
    const coords = endShape() || (editSel.kind === 'bloque' ? BYID[id].coords : editSel.coords);
    const notas = $('#e-notas').value.trim();
    editSel = null; lastSaved = { t, n };
    stage('Bloques', { id, territorio: t, bloque: n, coords: JSON.stringify(coords), notas });
  },
  bshape() {
    editSel.draft = { t: $('#e-t').value, n: $('#e-n').value, notas: $('#e-notas').value };
    if (shapeLayer) keepShape(); else startShape();
    renderAll();
  },
  bdel() {
    const id = editSel.id;
    endShape();
    editSel = null;
    stageRemove('Bloques', id);
  },
  bcancel() { endShape(); editSel = null; renderAll(); },
  ptadd() { addingPunto = true; toast('Toca el mapa donde está el punto de salida.'); renderAll(); },
  ptsave() {
    const letra = $('#pt-letra').value.trim().toUpperCase(), nombre = $('#pt-nombre').value.trim();
    if (!letra || !nombre) return toast('Pon la letra y el nombre.');
    const old = DB.Puntos.find(x => x.id === editSel.id);
    const p = old ? { ...old, letra, nombre } : { id: uid(), letra, nombre, lat: editSel.lat, lng: editSel.lng };
    editSel = null;
    stage('Puntos', p);
  },
  ptdel() { const id = editSel.id; editSel = null; stageRemove('Puntos', id); },
  ptcancel() { editSel = null; renderAll(); },
  guiaadj() { setGuideAdjust(!guideAdjust); renderAll(); },
  guiasave() { stage('Config', { id: 'guia', valor: JSON.stringify(guide.corners()) }); },
  guiaoff() { setGuideAdjust(false); map.removeLayer(guide); guide = null; renderAll(); },
};

const INPUT = {
  inffecha(el) { infFecha = el.value; infForm = {}; renderAll(); },
  nota(el) { infForm[el.dataset.id].nota = el.value; },
  quien(el) { store.set('territorios-quien', el.value); },
  'p-fecha'(el) { plan.fecha = el.value; },
  'p-hora'(el) { plan.hora = el.value; },
  'p-punto'(el) { plan.punto = el.value; },
  'p-conductor'(el) { plan.conductor = el.value; },
  'p-notas'(el) { plan.notas = el.value; },
  'p-nb'(el) { plan.notasB[el.dataset.id] = el.value; },
  tcolor(el) { stage('Territorios', { id: el.dataset.t, color: el.value, notas: '' }); },
  guiafile(el) { if (el.files[0]) loadGuide(el.files[0]); },
  guiaop(el) { guide.setOpacity(+el.value); },
};
// "change" for controls that re-render or save; "input" for live text so typing never loses focus.
const ON_CHANGE = ['inffecha', 'tcolor', 'guiafile', 'p-fecha', 'p-hora', 'p-punto'];

function onAct(e) {
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) Promise.resolve(ACT[el.dataset.act](el)).catch(() => {});
}
panel.addEventListener('click', onAct);
$('#pending').addEventListener('click', onAct);
$('#cola').addEventListener('click', onAct);
$('#share').addEventListener('click', e => { if (e.target.id === 'share') ACT.shareclose(); else onAct(e); });
panel.addEventListener('input', e => {
  const k = e.target.dataset.in;
  if (k && INPUT[k] && ON_CHANGE.indexOf(k) < 0) INPUT[k](e.target);
});
panel.addEventListener('change', e => {
  const k = e.target.dataset.in;
  if (k && INPUT[k] && ON_CHANGE.indexOf(k) >= 0) INPUT[k](e.target);
});
panel.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pin') ACT.pin(); });
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (shapeLayer) ACT.bcancel();
  tab = b.dataset.tab; editSel = null; addingPunto = false; verSalida = ''; showLogin = false;
  map.closePopup();
  renderAll();
});
window.addEventListener('beforeunload', e => { if (pendingCount()) { e.preventDefault(); e.returnValue = ''; } });

// ---------- start ----------
/** First view: the salida from a shared link, else today's salidas, else the whole territory. */
function fitStart() {
  map.invalidateSize();
  if (shownSalida()) return fitSalida(shownSalida());
  const today = todaySalidas().flatMap(salidaPts);
  const pts = today.length ? today : BL.length ? BL.flatMap(b => b.coords) : (window.MANZANAS || []).flatMap(c => c.coords);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 17 });
}
/** Accepts the app link from the QR, the Apps Script /exec URL, or just the id. */
function connect(text) {
  const t = text.trim(), m = t.match(/[?&]api=([\w-]+)/) || t.match(/\/s\/([\w-]+)\/exec/) || t.match(/^([\w-]{20,200})$/);
  if (!m) return toast('Ese enlace no sirve. Pide el código QR al encargado del territorio.');
  location.href = location.pathname + '?api=' + m[1];
}
async function start() {
  if (window.self !== window.top) { $('#openfull').href = location.href; $('#openfull').style.display = 'inline'; }
  if (DEMO) $('#demo').style.display = 'block';
  if (!API_ID && !DEMO) {
    $('#setup').classList.add('show');
    $('#setup-go').addEventListener('click', () => connect($('#setup-link').value));
    return;
  }
  const saved = safeJSON(store.get('predi-datos-' + KEY), null);
  if (saved) { SERVER = saved; rebuild(); fitStart(); }
  try {
    const data = await (saved ? api('getAll') : busy(api('getAll'), 'Cargando…'));
    setDB(data);
    if (!saved) fitStart();
  } catch (e) {
    if (saved) toast(e.offline ? 'Sin conexión: se muestran los últimos datos guardados.' : e.message, 5000);
  }
  flushCola();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
renderAll();
start();
</script>
